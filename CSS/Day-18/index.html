
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables</title>

    <style>
        /* Global variables */
        :root {
            --color: rgb(0, 42, 134);
            --seccolor: rgb(46, 105, 22);
        }

        /* Reset default spacing */
        * {
            margin: 0;
            padding: 0;
        }

        /* Select the first div */
        div:first-child {
            background-color: var(--color);
        }

        /* Container background */
        .container {
            background-color: var(--seccolor);
        }

        /* Navigation bar */
        ul {
            display: flex;
        }

        ul > li {
            list-style: none;
            padding: 34px;
        }

        /* Local variable */
        ul > li:first-child {
            --color: rgb(92, 82, 66);
            background-color: var(--color);
            border: 2px solid var(--seccolor);
        }
    </style>
</head>

<body>
    <div>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>

    <div class="container">
        Lorem ipsum dolor sit amet, consectetur adipisicing elit.
        Sed hic eum minima libero ut vel odit? Quos nisi, iure
        minima itaque distinctio laudantium dolorum animi praesentium
        necessitatibus ipsam soluta exercitationem neque?
    </div>
</body>

</html>
