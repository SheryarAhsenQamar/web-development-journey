<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling list using the css</title>
    <style>
     nav > ul > li{

    list-style: upper-roman;
     background-color: yellow;
     list-style-position: inside;/*this is used to move the numberings(markers) inside the box.*/
     border: 2px solid blue;
   }
    </style>
</head>
<body>
    <nav>
        <ul>
       <li> Home </li>
       <li> About </li>
       <li> Contact </li>

        </ul>
    </nav>
    
</body>
</html>
