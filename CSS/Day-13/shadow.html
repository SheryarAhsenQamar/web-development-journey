<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadow and outline</title>
    <style>
        .box {
            border: 2px solid blue;
            padding: 34px;
            box-shadow: 5px 15px 5px greenyellow
        }
        .text-shadow{
            text-shadow: 2px 2px 4px mediumspringgreen;
        }
    </style>
</head>

<body>
    <div class="box">
        i am a box
    </div>
    <div>
        <p class="text-shadow">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. At quod illum eveniet nobis reiciendis adipisci,
            corrupti sed, autem qui atque, facilis iste maxime ea. Quam nesciunt architecto expedita cupiditate
            praesentium odit accusamus debitis, maiores ipsa!
        </p>
    </div>
</body>

</html>
